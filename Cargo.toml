[package]
name = "duckdb_rphonetic"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "DuckDB extension exposing phonetic matching algorithms (Kölner Phonetik, Daitch-Mokotoff Soundex)"
repository = "https://github.com/guizmaii-opensource/duckdb-rphonetic"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
strip = true

[[example]]
# crate-type can't be (at the moment) be overriden for specific targets
# src/wasm_lib.rs forwards to src/lib.rs so that we can change from cdylib
# (that is needed while compiling natively) to staticlib (needed since the
# actual linking will be done via emcc
name = "duckdb_rphonetic"
path = "src/wasm_lib.rs"
crate-type = ["staticlib"]

[dependencies]
duckdb = { version = "~1.10505.0", features = ["loadable-extension", "vscalar"] }
rphonetic = { version = "3.1.0", features = ["embedded_dm"] }
